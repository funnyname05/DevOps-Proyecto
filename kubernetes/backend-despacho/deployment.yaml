apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-despacho
  namespace: proyecto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-despacho
  template:
    metadata:
      labels:
        app: back-despacho
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: back-despacho
        image: 895716090405.dkr.ecr.us-east-1.amazonaws.com/devops/back-despacho:v1
        ports:
        - containerPort: 8081
        env:
        - name: DB_ENDPOINT
          value: "proyecto-db-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "db_despachos"
        - name: DB_USERNAME
          value: "user_despachos"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD_DESPACHOS
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
