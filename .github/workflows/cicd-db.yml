name: CI/CD Proyecto DB
on:
  push:
    branches: [ "main" ]
    paths:
      - "db/**"
      
jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
      
    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Build imagen DB y push a ECR
      run: |
        mkdir proyecto-db
        cd proyecto-db
        docker build -t proyecto-db .
        docker tag proyecto-db:latest ${{ secrets.ECR_REPO_URL_DB }}:v1
        docker push ${{ secrets.ECR_REPO_URL_DB }}:v1
        
    - name: Desplegar DB vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-db desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "docker pull ${{ secrets.ECR_REPO_URL_DB }}:v1",
            "docker stop proyecto-db || true",
            "docker rm proyecto-db || true",
            "docker run -d --name proyecto-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.ECR_REPO_URL_DB }}:v1"
          ]}' \
          --output text
