name: CI/CD Proyecto DB
on:
  push:
    branches: [ "main" ]
    paths:
      - "db/**"

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen DB y push a ECR
      run: |
        cd db
        docker build -t proyecto-db .
        docker tag proyecto-db:latest ${{ secrets.ECR_REPO_URL_DB }}:v1
        docker push ${{ secrets.ECR_REPO_URL_DB }}:v1

    - name: Desplegar DB vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar proyecto-db desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "curl -L -o /home/ec2-user/docker-compose.yml https://github.com/funnyname05/DevOps-Proyecto/blob/b4b48ff2a57569f5b5b1d4d94019c63f40abd73e/db/docker-compose.yml",
            "source /home/ec2-user/.env",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
            "cd /home/ec2-user",
            "docker compose pull",
            "docker compose up -d --force-recreate"
          ]}' \
          --output text
